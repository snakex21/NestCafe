<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../native-ui/css/app.css" />
  <link rel="stylesheet" href="../modules/ocr-viewer/native.css" />
  <title>NestCafe visual regression fixture</title>
  <style>
    body { margin: 0; }
    #fixture { width: min(980px, 100vw); height: 700px; }
    .ocr-document-editor { width: 100%; height: 700px; }
  </style>
</head>
<body data-theme="dark">
  <main id="fixture">
    <div class="ocr-document-editor">
      <div class="ocr-word-stage">
        <article id="word-page" class="ocr-markdown-preview ocr-word-page">
          <h1 id="word-heading">Długi dokument testowy</h1>
          <div id="word-body"></div>
        </article>
      </div>
    </div>
  </main>
  <div class="sidebar-actions"><button class="new-chat" id="vr-new-chat" type="button"><span>+</span>Nowa rozmowa</button></div>
  <dialog id="test-dialog" class="confirm-dialog nestcafe-system-dialog">
    <h3>Potwierdzenie</h3><p>Test dialogu.</p>
    <div><button class="confirm-cancel">Anuluj</button><button class="confirm-delete">Usuń</button></div>
  </dialog>
  <script>
    const body = document.querySelector("#word-body");
    for (let i = 1; i <= 70; i += 1) {
      const p = document.createElement("p");
      p.textContent = `Akapit ${i}. To jest dłuższa treść sprawdzająca, czy biała kartka rośnie razem z dokumentem i nie wypuszcza tekstu na ciemne tło.`;
      body.append(p);
    }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const page = document.querySelector("#word-page");
      const heading = document.querySelector("#word-heading");
      const pageStyle = getComputedStyle(page);
      const headingStyle = getComputedStyle(heading);
      const pageHeight = page.getBoundingClientRect().height;
      const contentHeight = page.scrollHeight;
      const rgb = headingStyle.color.match(/\d+/g)?.slice(0, 3).map(Number) || [255,255,255];
      const headingIsDark = rgb.reduce((a, b) => a + b, 0) < 450;
      document.body.dataset.wordHeight = pageHeight + 2 >= contentHeight ? "ok" : "bad";
      document.body.dataset.wordBackground = pageStyle.backgroundColor === "rgb(255, 255, 255)" ? "ok" : "bad";
      document.body.dataset.wordHeading = headingIsDark ? "ok" : "bad";
      document.body.dataset.cssSplit = getComputedStyle(document.body).getPropertyValue("--nc-bg").trim() ? "ok" : "bad";
      const newChat = getComputedStyle(document.querySelector("#vr-new-chat"));
      document.body.dataset.newChatLabel = newChat.color !== newChat.backgroundColor ? "ok" : "bad";
      document.body.dataset.ready = "1";
    }));
  </script>
</body>
</html>
